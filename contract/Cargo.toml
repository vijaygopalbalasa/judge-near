[package]
name = "judge-escrow"
description = "Deterministic agent-job escrow on NEAR, payout follows an OutLayer judge verdict"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"
repository = "https://github.com/vijaygopalbalasa/judge-near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
