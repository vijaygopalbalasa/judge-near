<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Judge on NEAR: a transaction</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="One NEAR testnet transaction, read from NEAR archival nodes: who signed it, what it called, and every receipt's status, events and returned value.">
  <style>
    :root {
      --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1d1b; --muted: #5d5d58; --line: #e3e1da;
      --ok: #1f7a4d; --bad: #b3261e; --accent: #2d5bd7; --code: #f3f1ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #a9a8a1; --line: #34332f;
        --ok: #5cc98f; --bad: #f2867d; --accent: #8fb0ff; --code: #262522;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    h2 { font-size: 1.05rem; margin: 0 0 10px; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    .mono { font: 0.86rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .row { display: flex; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
    .row:first-of-type { border-top: 0; }
    .row .k { width: 120px; flex: none; color: var(--muted); font-size: 0.9rem; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    pre { margin: 6px 0 0; padding: 10px; background: var(--code); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font: 0.8rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    a { color: var(--accent); }
    #status { font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>A NEAR testnet transaction</h1>
  <p class="lead">Read from NEAR archival nodes, the same way the verifier reads rulings (public testnet explorers can lag
    behind). <a href="./">Back to the jobs and the verifier</a>.</p>
  <div id="status" role="status" aria-live="polite">Reading the transaction...</div>
  <div id="out"></div>
</main>
<script type="module" src="./tx.js"></script>
</body>
</html>
