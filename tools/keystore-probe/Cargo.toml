[package]
name = "keystore-probe"
version = "0.1.0"
edition = "2021"
description = "Prints which secrets OutLayer handed to this run (names and SHA-256 of values, never the values)."
license = "MIT"

[workspace]

[[bin]]
name = "keystore-probe"
path = "src/main.rs"

[features]
# A second build with different bytes (and so a different SHA-256), used to show that a
# secret bound to one build's hash is not handed to another build.
variant-b = []

[dependencies]
sha2 = { version = "0.10.9", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
