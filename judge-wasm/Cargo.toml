[package]
name = "judge-wasm"
version = "1.0.0"
edition = "2021"
description = "Deterministic job-escrow judge for OutLayer TEE workers (wasm32-wasip1)."
license = "MIT"

# Standalone package: do not search parent directories for a workspace.
[workspace]

[[bin]]
name = "judge"
path = "src/main.rs"

[lib]
name = "judge_wasm"
path = "src/lib.rs"

[dependencies]
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
# Sealed mode (docs/interface.md section 6.3). Default features are off on purpose:
# the defaults pull in getrandom, which would add the WASI random_get import.
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2.0.1", default-features = false }
hkdf = { version = "0.12.4", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
